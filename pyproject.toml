[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triallens"
version = "1.0.0"
description = "Synthetic clinical-trial data quality and safety analytics portfolio project"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "streamlit>=1.32"]

[tool.setuptools.packages.find]
where = ["src"]
